apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Enables cluster interaction / Agent mode (Kubernetes MCP server) so the model
# can read live cluster state — this powers Lightspeed's Troubleshooting mode.
# Requires a tool-calling-capable model (see the model matrix in the README).
patches:
  - path: patch.yaml
    target:
      kind: OLSConfig
      name: cluster
