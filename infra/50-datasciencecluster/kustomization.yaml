apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Configures OpenShift AI for single-model serving via KServe (RawDeployment).
# NOTE: the DSCInitialization is intentionally NOT applied here — newer RHOAI
# auto-creates default-dsci with an immutable monitoring.namespace, so re-applying
# ours is rejected. provision.sh applies dscinitialization.yaml only if one is
# absent (older RHOAI). Requires the RHOAI CRDs (layer 40).
resources:
  - datasciencecluster.yaml
