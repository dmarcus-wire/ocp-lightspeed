apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Node Feature Discovery operator + instance. Labels nodes by hardware so the
# NVIDIA GPU operator can find GPU nodes. Prerequisite for layer 30.
# NOTE: apply the operator first, wait for the nodefeaturediscoveries CRD, then
# the CR — `make infra` / provision.sh handle that ordering.
resources:
  - namespace.yaml
  - operatorgroup.yaml
  - subscription.yaml
  - nodefeaturediscovery.yaml
