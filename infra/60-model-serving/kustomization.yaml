apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Serves a Red Hat validated model with vLLM on KServe (RawDeployment). The
# InferenceService exposes an OpenAI-compatible API at <status.url>/v1, which the
# self-hosted overlay points Lightspeed at. Requires KServe (layer 50) and a
# Ready GPU node (layers 10-30).
resources:
  - namespace.yaml
  - serving-runtime.yaml
  - inference-service.yaml
